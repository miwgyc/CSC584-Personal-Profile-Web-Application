<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-card">

            <h1>Personal Profile</h1>
            <p>Please enter your personal information below.</p>

            <form action="ProfileServlet" method="post">

                <label>Full Name</label>
                <input type="text" name="name"
                       placeholder="Enter your full name" required>

                <label>Student ID</label>
                <input type="text" name="studentId"
                       placeholder="Enter your student ID" required>

                <label>Programme</label>
                <input type="text" name="programme"
                       placeholder="Enter your programme" required>

                <label>Email Address</label>
                <input type="email" name="email"
                       placeholder="Enter your email" required>

                <label>Hobbies</label>
                <input type="text" name="hobbies"
                       placeholder="Enter your hobbies" required>

                <label>Short Self-Introduction</label>
                <textarea name="introduction" rows="4"
                          placeholder="Tell us about yourself"
                          required></textarea>

                <button type="submit">Submit Profile</button>

            </form>

        </div>
    </div>

</body>
</html>
